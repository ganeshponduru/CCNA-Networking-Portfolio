<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">OSI and TCP/IP layer mapping</title><desc id="desc">Seven OSI layers mapped approximately to four TCP/IP layers.</desc>
<rect width="1000" height="560" rx="20" fill="#f8fafc"/><text x="250" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">OSI model (7 layers)</text><text x="730" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">TCP/IP model (4 layers)</text>
<g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
<rect x="70" y="70" width="360" height="52" rx="8" fill="#bfdbfe"/><text x="250" y="102">7 · Application</text>
<rect x="70" y="128" width="360" height="52" rx="8" fill="#bfdbfe"/><text x="250" y="160">6 · Presentation</text>
<rect x="70" y="186" width="360" height="52" rx="8" fill="#bfdbfe"/><text x="250" y="218">5 · Session</text>
<rect x="70" y="244" width="360" height="52" rx="8" fill="#bbf7d0"/><text x="250" y="276">4 · Transport</text>
<rect x="70" y="302" width="360" height="52" rx="8" fill="#fde68a"/><text x="250" y="334">3 · Network</text>
<rect x="70" y="360" width="360" height="52" rx="8" fill="#fed7aa"/><text x="250" y="392">2 · Data Link</text>
<rect x="70" y="418" width="360" height="52" rx="8" fill="#fed7aa"/><text x="250" y="450">1 · Physical</text>
<rect x="550" y="70" width="360" height="168" rx="8" fill="#bfdbfe"/><text x="730" y="157">Application</text><text x="730" y="184" font-size="14">Approx. OSI layers 5–7</text>
<rect x="550" y="244" width="360" height="52" rx="8" fill="#bbf7d0"/><text x="730" y="276">Transport</text>
<rect x="550" y="302" width="360" height="52" rx="8" fill="#fde68a"/><text x="730" y="334">Internet</text>
<rect x="550" y="360" width="360" height="110" rx="8" fill="#fed7aa"/><text x="730" y="405">Network Access / Link</text><text x="730" y="432" font-size="14">Approx. OSI layers 1–2</text>
</g><text x="500" y="510" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#334155">Mapping is approximate; real implementations do not always align exactly.</text><text x="500" y="538" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Original study diagram · CCNA Networking Portfolio</text></svg>